name: Play Internal Testing Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || (echo "Missing UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$UPLOAD_STORE_PASSWORD" || (echo "Missing UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$UPLOAD_KEY_PASSWORD" || (echo "Missing UPLOAD_KEY_PASSWORD" && exit 1)
          test -n "$UPLOAD_KEY_ALIAS" || (echo "Missing UPLOAD_KEY_ALIAS" && exit 1)

      - name: Materialize upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/connect-signing"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-signing/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/connect-signing/upload-keystore.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/connect-signing/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: connect-play-internal-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
