name: Android CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Create ephemeral CI release key
        run: |
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/connect-ci-release.jks"             -storepass ci-only-password             -keypass ci-only-password             -alias upload             -keyalg RSA             -keysize 2048             -validity 1             -dname "CN=Connect CI, OU=CI, O=Connect, L=Kathmandu, C=NP"

      - name: Validate release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/connect-ci-release.jks
          STORE_PASSWORD: ci-only-password
          KEY_PASSWORD: ci-only-password
          KEY_ALIAS: upload
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload generated wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.3.1
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: connect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
