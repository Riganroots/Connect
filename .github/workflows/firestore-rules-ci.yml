name: Firestore Rules CI
on:
  push:
    branches: [main, 'codex/**', 'claude/**']
    paths: ['firestore.rules', 'firebase.json', 'rules-tests/**', '.github/workflows/firestore-rules-ci.yml']
  pull_request:
    branches: [main]
    paths: ['firestore.rules', 'firebase.json', 'rules-tests/**', '.github/workflows/firestore-rules-ci.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rule test dependencies
        working-directory: rules-tests
        run: npm ci --no-audit --no-fund
      - name: Test access rules in isolated demo emulator
        working-directory: rules-tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firestore-rule-debug-logs
          path: '**/*debug.log'
          if-no-files-found: ignore
